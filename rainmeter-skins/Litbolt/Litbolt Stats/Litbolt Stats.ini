[Rainmeter]
Update=300
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

@IncludePath=#SKINSPATH#Litbolt\@Resources\
@Include=Theme.inc
@Include2=#@#data.inc

[Metadata]
Name=Litbolt Stats
Author=Litbolt
Information=CurseForge download counts + Etsy placeholder (feeder every 3h).

[Variables]
W=300

[MeasureInc]
Measure=Plugin
Plugin=QuotePlugin
PathName=#@#
FileFilter=data.inc
Subfolders=0
UpdateDivider=300
OnChangeAction=[!Refresh]

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,178,#Corner# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=Litbolt Stats
FontFace=#FontName#
FontSize=#FontSizeTitle#
FontColor=#ColorGold#
X=#Pad#
Y=#Pad#
AntiAlias=1
DynamicVariables=1

[MeterUpdated]
Meter=String
Text=Updated #StatsUpdated#
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=32
W=(#W#-#Pad#*2)
ClipString=1
AntiAlias=1
DynamicVariables=1
Hidden=(#StatsOk# = 0 ? 1 : 0)

[MeterFlash]
Meter=String
Text=Better Flashlight Addon
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=54
AntiAlias=1
DynamicVariables=1

[MeterFlashVal]
Meter=String
Text=#FlashlightDownloads#  (#FlashlightDelta#)
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#ColorText#
X=(#W#-#Pad#)
Y=54
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterMaple]
Meter=String
Text=Maple Bear Apocalypse
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=76
AntiAlias=1
DynamicVariables=1

[MeterMapleVal]
Meter=String
Text=#MapleDownloads#  (#MapleDelta#)
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#ColorText#
X=(#W#-#Pad#)
Y=76
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterEtsyHdr]
Meter=String
Text=Etsy shop
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=104
AntiAlias=1
DynamicVariables=1

[MeterEtsyVal]
Meter=String
Text=#EtsyLine#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#ColorGold#
X=#Pad#
Y=122
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1

[MeterStatus]
Meter=String
Text=#StatsMessage#
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=54
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=(#StatsOk# = 1 ? 1 : 0)
