[Rainmeter]
Update=60
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

@IncludePath=#SKINSPATH#Litbolt\@Resources\
@Include=Theme.inc
@Include2=#@#data.inc

[Metadata]
Name=Today
Author=Litbolt
Information=Calendar + countdowns from @Resources\\data.inc (feeder script).

[Variables]
W=300

[MeasureInc]
Measure=Plugin
Plugin=QuotePlugin
PathName=#@#
FileFilter=data.inc
Subfolders=0
UpdateDivider=60
OnChangeAction=[!Refresh]

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,200,#Corner# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=Today
FontFace=#FontName#
FontSize=#FontSizeTitle#
FontColor=#ColorGold#
X=#Pad#
Y=#Pad#
AntiAlias=1
DynamicVariables=1

[MeterDate]
Meter=String
Text=#TodayDate#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=#Pad#
Y=34
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1

[MeterEventsHdr]
Meter=String
Text=Up next
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=58
AntiAlias=1
DynamicVariables=1

[MeterE1]
Meter=String
Text=#Event1#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=#Pad#
Y=74
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=([#Event1#]="")

[MeterE2]
Meter=String
Text=#Event2#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=#Pad#
Y=92
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=([#Event2#]="")

[MeterE3]
Meter=String
Text=#Event3#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=#Pad#
Y=110
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=([#Event3#]="")

[MeterCdHdr]
Meter=String
Text=Countdowns
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=132
AntiAlias=1
DynamicVariables=1

[MeterC1]
Meter=String
Text=#Countdown1#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorGold#
X=#Pad#
Y=148
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=([#Countdown1#]="")

[MeterC2]
Meter=String
Text=#Countdown2#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorGold#
X=#Pad#
Y=166
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=([#Countdown2#]="")

[MeterStatus]
Meter=String
Text=#DataMessage#
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=74
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=(#DataOk# = 1 ? 1 : 0)
