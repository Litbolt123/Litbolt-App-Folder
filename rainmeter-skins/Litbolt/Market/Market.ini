[Rainmeter]
Update=60
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

@IncludePath=#SKINSPATH#Litbolt\@Resources\
@Include=Theme.inc
@Include2=#@#data.inc

[Metadata]
Name=Market
Author=Litbolt
Information=MU, SNDK, BTC-USD via feeder (Yahoo chart API).

[Variables]
W=260

[MeasureInc]
Measure=Plugin
Plugin=QuotePlugin
PathName=#@#
FileFilter=data.inc
Subfolders=0
UpdateDivider=60
OnChangeAction=[!Refresh]

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,148,#Corner# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=Market
FontFace=#FontName#
FontSize=#FontSizeTitle#
FontColor=#ColorGold#
X=#Pad#
Y=#Pad#
AntiAlias=1
DynamicVariables=1

[MeterMuLbl]
Meter=String
Text=MU
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=40
AntiAlias=1
DynamicVariables=1

[MeterMuVal]
Meter=String
Text=#MuPrice#  #MuChange#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#MuColor#
X=(#W#-#Pad#)
Y=40
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterSndkLbl]
Meter=String
Text=SNDK
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=64
AntiAlias=1
DynamicVariables=1

[MeterSndkVal]
Meter=String
Text=#SndkPrice#  #SndkChange#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#SndkColor#
X=(#W#-#Pad#)
Y=64
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterBtcLbl]
Meter=String
Text=BTC-USD
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=88
AntiAlias=1
DynamicVariables=1

[MeterBtcVal]
Meter=String
Text=#BtcPrice#  #BtcChange#
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#BtcColor#
X=(#W#-#Pad#)
Y=88
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterUpdated]
Meter=String
Text=#MarketUpdated#
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=118
W=(#W#-#Pad#*2)
ClipString=1
AntiAlias=1
DynamicVariables=1
Hidden=(#MarketOk# = 0 ? 1 : 0)

[MeterStatus]
Meter=String
Text=#MarketMessage#
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=40
W=(#W#-#Pad#*2)
ClipString=2
AntiAlias=1
DynamicVariables=1
Hidden=(#MarketOk# = 1 ? 1 : 0)
