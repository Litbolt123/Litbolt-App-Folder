[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

@IncludePath=#SKINSPATH#Litbolt\@Resources\
@Include=Theme.inc
@Include2=#@#sensors.inc

[Metadata]
Name=Helios Health
Author=Litbolt
Information=CPU/GPU sensors via HWiNFO plugin + ThrottleStop process check.

[Variables]
W=280
TempColor0=#ColorText#
TempColor1=#ColorGold#
TempColor2=#ColorRed#

[MeasureThrottleStop]
Measure=Process
ProcessName=ThrottleStop.exe
UpdateDivider=2

[MeasureCpuTemp]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFOSensorIdCpuTemp#
HWiNFOSensorInstance=#HWiNFOSensorInstanceCpuTemp#
HWiNFOSensorEntryId=#HWiNFOSensorEntryIdCpuTemp#
MinValue=0
MaxValue=120

[MeasureCpuPower]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFOSensorIdCpuPower#
HWiNFOSensorInstance=#HWiNFOSensorInstanceCpuPower#
HWiNFOSensorEntryId=#HWiNFOSensorEntryIdCpuPower#
MinValue=0
MaxValue=200

[MeasureGpuTemp]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFOSensorIdGpuTemp#
HWiNFOSensorInstance=#HWiNFOSensorInstanceGpuTemp#
HWiNFOSensorEntryId=#HWiNFOSensorEntryIdGpuTemp#
MinValue=0
MaxValue=120

[MeasureFanRpm]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFOSensorIdFanRpm#
HWiNFOSensorInstance=#HWiNFOSensorInstanceFanRpm#
HWiNFOSensorEntryId=#HWiNFOSensorEntryIdFanRpm#
MinValue=0
MaxValue=8000

[MeasureCpuTempBracket]
Measure=Calc
Formula=(MeasureCpuTemp >= 95 ? 2 : (MeasureCpuTemp >= 80 ? 1 : 0))
DynamicVariables=1

[MeasureGpuTempBracket]
Measure=Calc
Formula=(MeasureGpuTemp >= 95 ? 2 : (MeasureGpuTemp >= 80 ? 1 : 0))
DynamicVariables=1

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,168,#Corner# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=Helios Health
FontFace=#FontName#
FontSize=#FontSizeTitle#
FontColor=#ColorGold#
X=#Pad#
Y=#Pad#
AntiAlias=1
DynamicVariables=1

[MeterThrottleBanner]
Meter=String
MeasureName=MeasureThrottleStop
Text=%1
FontFace=#FontName#
FontSize=12
FontWeight=700
X=#Pad#
Y=34
W=(#W#-#Pad#*2)
ClipString=1
AntiAlias=1
DynamicVariables=1
Substitute="1":"✓ ThrottleStop is running","0":"⚠ ThrottleStop is OFF"
FontColor=#ColorRed#
Hidden=(MeasureThrottleStop = 1 ? 0 : 1)

[MeterThrottleOk]
Meter=String
MeasureName=MeasureThrottleStop
Text=%1
FontFace=#FontName#
FontSize=12
FontWeight=700
X=#Pad#
Y=34
W=(#W#-#Pad#*2)
ClipString=1
AntiAlias=1
DynamicVariables=1
Substitute="1":"✓ ThrottleStop is running","0":""
FontColor=#ColorGreen#
Hidden=(MeasureThrottleStop = 1 ? 1 : 0)

[MeterRowCpuT]
Meter=String
Text=CPU package
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=62
AntiAlias=1
DynamicVariables=1

[MeterRowCpuTVal]
Meter=String
MeasureName=MeasureCpuTemp
Text=%1°C
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
X=(#W#-#Pad#)
Y=62
StringAlign=Right
AntiAlias=1
DynamicVariables=1
FontColor=#TempColor[MeasureCpuTempBracket]#

[MeterRowCpuP]
Meter=String
Text=CPU power
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=82
AntiAlias=1
DynamicVariables=1

[MeterRowCpuPVal]
Meter=String
MeasureName=MeasureCpuPower
Text=%1 W
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#ColorText#
X=(#W#-#Pad#)
Y=82
StringAlign=Right
AntiAlias=1
DynamicVariables=1

[MeterRowGpu]
Meter=String
Text=GPU temp
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=102
AntiAlias=1
DynamicVariables=1

[MeterRowGpuVal]
Meter=String
MeasureName=MeasureGpuTemp
Text=%1°C
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
X=(#W#-#Pad#)
Y=102
StringAlign=Right
AntiAlias=1
DynamicVariables=1
FontColor=#TempColor[MeasureGpuTempBracket]#

[MeterRowFan]
Meter=String
Text=Fan RPM
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorMuted#
X=#Pad#
Y=122
AntiAlias=1
DynamicVariables=1

[MeterRowFanVal]
Meter=String
MeasureName=MeasureFanRpm
Text=%1 RPM
FontFace=#FontName#
FontSize=#FontSizeBody#
FontWeight=600
FontColor=#ColorText#
X=(#W#-#Pad#)
Y=122
StringAlign=Right
AntiAlias=1
DynamicVariables=1
