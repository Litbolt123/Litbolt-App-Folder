[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

@Include=#@#Theme.inc

[Metadata]
Name=Mode
Author=Litbolt
Information=Quiet, Balanced, and Game packs for Predator Sense Explorer. Companion to Helios Health. Does not focus a window.

[Variables]
W=280
StatusFile=C:\Users\Augus\AppData\Local\PredatorSenseExplorer\mode-status.txt

[MeasureStatus]
Measure=WebParser
URL=file://#StatusFile#
RegExp=(?si)^([^\r\n]*)\r?\n([^\r\n]*)\r?\n([^\r\n]*)
UpdateRate=1
StringIndex=1
FinishAction=[!UpdateMeasure MeasureMode][!UpdateMeasure MeasureTs][!UpdateMeasure MeasureDetail][!UpdateMeasure MeasureTsShown][!Redraw]

[MeasureMode]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=1

[MeasureTs]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=2

[MeasureDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=3
IfMatch=(?i)not running|^Quiet failed|^Balanced failed|^Game failed
IfMatchAction=[!SetOption MeterDetail FontColor 232,90,90]
IfNotMatchAction=[!SetOption MeterDetail FontColor #ColorText#]
IfMatchMode=1

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,168,#Corner# | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=Mode
FontFace=#FontName#
FontSize=#FontSizeTitle#
FontColor=#ColorGold#
X=#Pad#
Y=#Pad#
AntiAlias=1

[MeasureTsShown]
Measure=String
String=[MeasureTs]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^\s*$":"TS pending","^-$":"TS pending","^\x{2013}$":"TS pending","^\x{2014}$":"TS pending","^[^A-Za-z0-9]$":"TS pending"

[MeterTs]
Meter=String
MeasureName=MeasureTsShown
Text=TS %1
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=#Pad#
Y=34
W=(#W#-#Pad#*2)
H=18
ClipString=1
AntiAlias=1
ToolTipText=Auto Quiet uses this same Quiet pack when you are away. At the desk, Quiet stays until Balanced or Game.
DynamicVariables=1

[MeterDetail]
Meter=String
MeasureName=MeasureDetail
Text=%1
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorText#
X=#Pad#
Y=54
W=(#W#-#Pad#*2)
H=18
ClipString=1
AntiAlias=1
ToolTipText=Same words as Predator Sense Explorer. A red line means the pack did not apply.
DynamicVariables=1

[MeterAwayHint]
Meter=String
Text=Auto Quiet uses this pack when you are away.
FontFace=#FontName#
FontSize=#FontSizeSmall#
FontColor=#ColorMuted#
X=#Pad#
Y=74
W=(#W#-#Pad#*2)
ClipString=1
AntiAlias=1

[MeasureModePick]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=1
IfMatch=^Quiet
IfMatchAction=[!SetOption MeterQuiet FontColor 232,160,74][!SetOption MeterQuiet FontWeight 700][!SetOption MeterBalanced FontColor 136,144,160][!SetOption MeterBalanced FontWeight 400][!SetOption MeterGame FontColor 136,144,160][!SetOption MeterGame FontWeight 400][!ShowMeter MeterAccentQuiet][!HideMeter MeterAccentBalanced][!HideMeter MeterAccentGame][!UpdateMeter MeterQuiet][!UpdateMeter MeterBalanced][!UpdateMeter MeterGame][!UpdateMeter MeterAccentQuiet][!UpdateMeter MeterAccentBalanced][!UpdateMeter MeterAccentGame]
IfMatch2=^Balanced
IfMatchAction2=[!SetOption MeterQuiet FontColor 136,144,160][!SetOption MeterQuiet FontWeight 400][!SetOption MeterBalanced FontColor 232,160,74][!SetOption MeterBalanced FontWeight 700][!SetOption MeterGame FontColor 136,144,160][!SetOption MeterGame FontWeight 400][!HideMeter MeterAccentQuiet][!ShowMeter MeterAccentBalanced][!HideMeter MeterAccentGame][!UpdateMeter MeterQuiet][!UpdateMeter MeterBalanced][!UpdateMeter MeterGame][!UpdateMeter MeterAccentQuiet][!UpdateMeter MeterAccentBalanced][!UpdateMeter MeterAccentGame]
IfMatch3=^Game
IfMatchAction3=[!SetOption MeterQuiet FontColor 136,144,160][!SetOption MeterQuiet FontWeight 400][!SetOption MeterBalanced FontColor 136,144,160][!SetOption MeterBalanced FontWeight 400][!SetOption MeterGame FontColor 232,160,74][!SetOption MeterGame FontWeight 700][!HideMeter MeterAccentQuiet][!HideMeter MeterAccentBalanced][!ShowMeter MeterAccentGame][!UpdateMeter MeterQuiet][!UpdateMeter MeterBalanced][!UpdateMeter MeterGame][!UpdateMeter MeterAccentQuiet][!UpdateMeter MeterAccentBalanced][!UpdateMeter MeterAccentGame]
IfNotMatchAction=[!SetOption MeterQuiet FontColor 240,242,246][!SetOption MeterQuiet FontWeight 400][!SetOption MeterBalanced FontColor 240,242,246][!SetOption MeterBalanced FontWeight 400][!SetOption MeterGame FontColor 240,242,246][!SetOption MeterGame FontWeight 400][!HideMeter MeterAccentQuiet][!HideMeter MeterAccentBalanced][!HideMeter MeterAccentGame][!UpdateMeter MeterQuiet][!UpdateMeter MeterBalanced][!UpdateMeter MeterGame][!UpdateMeter MeterAccentQuiet][!UpdateMeter MeterAccentBalanced][!UpdateMeter MeterAccentGame]

[MeterQuiet]
Meter=String
Text=Quiet
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=24
Y=100
AntiAlias=1
SolidColor=34,38,48
Padding=14,8,14,8
LeftMouseUpAction=["#CURRENTPATH#PseMode.exe" "quiet"]
ToolTipText=Quiet curve, Acer Quiet, ThrottleStop Battery. Stays until you pick Balanced or Game.

[MeterBalanced]
Meter=String
Text=Balanced
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=108
Y=100
AntiAlias=1
SolidColor=34,38,48
Padding=14,8,14,8
LeftMouseUpAction=["#CURRENTPATH#PseMode.exe" "balanced"]
ToolTipText=Acer Balanced, main fan curves, ThrottleStop desk profile (Game).

[MeterGame]
Meter=String
Text=Game
FontFace=#FontName#
FontSize=#FontSizeBody#
FontColor=#ColorText#
X=210
Y=100
AntiAlias=1
SolidColor=34,38,48
Padding=14,8,14,8
LeftMouseUpAction=["#CURRENTPATH#PseMode.exe" "game"]
ToolTipText=Acer Performance, main fan curves, ThrottleStop Game.

[MeterAccentQuiet]
Meter=Shape
X=24
Y=140
Shape=Rectangle 0,0,70,2,1 | Fill Color #ColorGold# | StrokeWidth 0
Hidden=1

[MeterAccentBalanced]
Meter=Shape
X=108
Y=140
Shape=Rectangle 0,0,96,2,1 | Fill Color #ColorGold# | StrokeWidth 0
Hidden=1

[MeterAccentGame]
Meter=Shape
X=210
Y=140
Shape=Rectangle 0,0,64,2,1 | Fill Color #ColorGold# | StrokeWidth 0
Hidden=1
