name: Windows installer

run-name: "${{ github.ref_type == 'tag' && format('Litbolt apps {0} - Windows installers', github.ref_name) || format('Litbolt apps - Windows installers (manual {0})', github.ref_name) }}"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path -LiteralPath $iscc) {
            Write-Host "Inno Setup 6 already present: $iscc"
            exit 0
          }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read version from MSBuild (Directory.Build.props)
        id: version
        shell: pwsh
        run: |
          $ver = & .\scripts\get-version.ps1
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "get-version.ps1 returned empty" }
          Write-Host "Version: $ver"
          "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Prerelease flag
        id: release_meta
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.app_version }}"
          $isPre = [bool]($v -match '^\d+(\.\d+)*-.+$')
          "prerelease=$($isPre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches Version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref }}" -replace '^refs/tags/v',''
          $ver = "${{ steps.version.outputs.app_version }}"
          if ($tag -ne $ver) {
            throw "Git tag is 'v$tag' but Version is '$ver'. Bump Directory.Build.props or retag."
          }

      - name: Publish both apps (self-contained)
        shell: pwsh
        run: .\scripts\publish-installer.ps1 -App All

      - name: Compile Inno Setup (both installers)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.app_version }}"
          & .\scripts\write-version-inc.ps1 -Version $ver | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          Push-Location installer
          try {
            & $iscc "/DAppVersion=$ver" .\LitboltAppFolder.iss
            if ($LASTEXITCODE -ne 0) { throw "LitboltAppFolder.iss failed" }
            & $iscc "/DAppVersion=$ver" .\LocalVideoHub.iss
            if ($LASTEXITCODE -ne 0) { throw "LocalVideoHub.iss failed" }
            foreach ($name in @("LitboltAppFolder-Setup-$ver.exe", "LocalVideoHub-Setup-$ver.exe")) {
              if (-not (Test-Path "Output\$name")) { throw "Missing Output\$name" }
              Write-Host "OK: Output\$name"
            }
          }
          finally { Pop-Location }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Litbolt-Setup-${{ steps.version.outputs.app_version }}
          path: installer/Output/*.exe

      - name: Verify release notes (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $p = "docs/RELEASE_BODY.md"
          if (-not (Test-Path -LiteralPath $p)) { throw "Missing $p — see docs/releasing.md" }
          $t = (Get-Content -LiteralPath $p -Raw).Trim()
          if ($t.Length -lt 80) { throw "$p is too short" }

      - name: Publish GitHub Release (Litbolt-App-Folder repo)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Litbolt apps ${{ steps.version.outputs.app_version }} - Windows installers"
          files: installer/Output/*.exe
          body_path: docs/RELEASE_BODY.md
          generate_release_notes: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release_meta.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
